<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Fasta Status Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="top">
    <div class="wrap wide">
      <a class="logo" href="/admin/"><span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Fasta <small>Status admin</small></span></a>
      <nav class="tabs" aria-label="Admin sections">
        <a href="#monitors" data-view="monitors">Monitors</a>
        <a href="#incidents" data-view="incidents">Incidents</a>
        <a href="#maintenance" data-view="maintenance">Maintenance</a>
        <a href="#changelog" data-view="changelog">Changelog</a>
        <a href="#upcoming" data-view="upcoming">Upcoming</a>
        <a href="/" target="_blank" rel="noopener">Public page ↗</a>
      </nav>
      <span class="small" style="color:#aabbaf"><span id="who"></span> <button id="logout" type="button" class="btn small" hidden style="margin-left:6px">Sign out</button></span>
    </div>
  </header>
  <main class="wrap wide">
    <div id="flash" role="status" aria-live="polite"></div>
    <form id="signin" class="card" hidden style="max-width:420px;margin:40px auto;padding:22px">
      <h1 style="font-size:1.25rem;margin-bottom:6px">Sign in to Fasta Status</h1>
      <p class="small muted" style="margin:0 0 6px">For the Fasta operations team. This login is separate from the Fasta admin panel, so it works even when Fasta is down.</p>
      <label for="si-email">Email</label><input type="text" id="si-email" name="email" autocomplete="username" inputmode="email" required>
      <label for="si-pass">Password</label><input type="password" id="si-pass" name="password" autocomplete="current-password" required>
      <div class="btns"><button class="btn primary" style="width:100%">Sign in</button></div>
      <p id="si-err" class="small" style="color:var(--bad);min-height:1.2em" role="alert"></p>
    </form>
    <div id="app"></div>
  </main>
  <script src="/admin/admin.js" defer></script>
</body>
</html>
