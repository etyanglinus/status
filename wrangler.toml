# Generated by `npm run setup` on 2026-11-07T07:25:02.110Z. Re-run setup to change it.
name = "fasta-status"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/admin/api/*"]

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fasta-status"
database_id = "8e773df4-5dbc-4f33-906a-4613942acd5c"
migrations_dir = "migrations"

[observability]
enabled = true

[vars]
STOREFRONT_URL = "https://web.fastadeliveries.co.ke"
API_URL = "https://fastadeliveries.co.ke"
SELLER_LOGIN_PATH = "/login/vendor"
CATALOGUE_CHECK = "true"
CATALOGUE_ZONE_IDS = "[1]"
STOREFRONT_LISTING_PATH = ""
BRANDSITE_TEST_SLUG = ""
BRANDSITE_CUSTOM_DOMAIN_URL = ""
TRACKING_ENABLED = "false"
CHECKOUT_QUOTE_ENABLED = "false"
CHECK_TIMEOUT_MS = "10000"
SLOW_RESPONSE_MS = "5000"
FAIL_THRESHOLD = "3"
RECOVER_THRESHOLD = "2"
STALE_AFTER_SECONDS = "180"
PUBLIC_CACHE_SECONDS = "15"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
PUBLIC_URL = "https://status.fastadeliveries.co.ke"
DASHBOARD_URL = "https://status.fastadeliveries.co.ke/admin/"
